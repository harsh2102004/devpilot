# =================================================================
# DevPilot Multi-Service Production Orchestration (Sub-Phase 10A)
#
# Services:
# 1. mongo          - Primary document database for users, projects, graphs, test runs
# 2. redis          - In-memory data store powering BullMQ task queues
# 3. server         - Node.js Express REST API & SSE streaming chat server
# 4. scanner-worker - Background BullMQ worker for AST parsing & Pinecone indexing
# 5. test-worker    - Background BullMQ worker for sandboxed test execution
# 6. client         - Production Nginx server hosting React/Vite SPA & API reverse proxy
# =================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------
  # 1. MongoDB Database
  # ---------------------------------------------------------------
  mongo:
    container_name: devpilot-mongo
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: devpilot
    volumes:
      - mongo_data:/data/db
    networks:
      - devpilot-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------
  # 2. Redis Message Broker & Queue Backend
  # ---------------------------------------------------------------
  redis:
    container_name: devpilot-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - devpilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------
  # 3. DevPilot Express API Server
  # ---------------------------------------------------------------
  server:
    container_name: devpilot-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/devpilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set it}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set it}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-devpilot-codebase}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------
  # 4. Scanner Worker (Repository AST & Semantic Indexing Pipeline)
  # ---------------------------------------------------------------
  scanner-worker:
    container_name: devpilot-scanner-worker
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/devpilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-devpilot-codebase}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devpilot-network
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const Redis = require(\"ioredis\"); const r = new Redis({ host: process.env.REDIS_HOST || \"redis\", port: 6379, maxRetriesPerRequest: 1 }); r.ping().then(() => { r.disconnect(); process.exit(0); }).catch(() => process.exit(1));' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------
  # 5. Test Worker (Sandboxed Test Runner Pipeline)
  # ---------------------------------------------------------------
  test-worker:
    container_name: devpilot-test-worker
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "worker:test"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/devpilot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devpilot-network
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const Redis = require(\"ioredis\"); const r = new Redis({ host: process.env.REDIS_HOST || \"redis\", port: 6379, maxRetriesPerRequest: 1 }); r.ping().then(() => { r.disconnect(); process.exit(0); }).catch(() => process.exit(1));' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------
  # 6. React/Vite Frontend Web Client (Nginx SPA + API Reverse Proxy)
  # ---------------------------------------------------------------
  client:
    container_name: devpilot-client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - devpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# -----------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------
volumes:
  mongo_data:
    name: devpilot_mongo_data
  redis_data:
    name: devpilot_redis_data

# -----------------------------------------------------------------
# Isolated Bridge Network
# -----------------------------------------------------------------
networks:
  devpilot-network:
    name: devpilot-network
    driver: bridge

